name: ci
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U test" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults: { run: { working-directory: backend } }
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/test
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run migrate
      - run: npm test

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: mobile
      - run: npm run typecheck
        working-directory: mobile
      # payload assinado: app e servidor precisam gerar bytes idênticos
      - run: npm run verify:contract
        working-directory: mobile
      - run: npm run verify:session
        working-directory: mobile
      - run: npx expo export --platform android --platform ios --output-dir /tmp/export
        working-directory: mobile
